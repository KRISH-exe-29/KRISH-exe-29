<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Soft UI panel for Krishna Raju S: soft on the eyes, hard on manual work. Automation on, manual entry off, chai on. Output knob at 9 apps. Now shipping KioskSentinel."><title>Soft UI panel for Krishna Raju S: soft on the eyes, hard on manual work. Automation on, manual entry off, chai on. Output knob at 9 apps. Now shipping KioskSentinel.</title><defs><filter id="up" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="-8" dy="-8" stdDeviation="8" flood-color="#FFFFFF"/><feDropShadow dx="8" dy="8" stdDeviation="9" flood-color="#A3B1C6"/></filter><filter id="in" x="-10%" y="-10%" width="120%" height="120%"><feFlood flood-color="#A3B1C6" result="d"/><feComposite in2="SourceAlpha" operator="out"/><feGaussianBlur stdDeviation="5"/><feOffset dx="5" dy="5" result="s1"/><feFlood flood-color="#FFFFFF"/><feComposite in2="SourceAlpha" operator="out"/><feGaussianBlur stdDeviation="5"/><feOffset dx="-5" dy="-5" result="s2"/><feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="s1"/><feMergeNode in="s2"/></feMerge><feComposite in2="SourceAlpha" operator="in"/></filter></defs><style>.knob{animation:kb 4s ease-in-out infinite alternate}@keyframes kb{from{transform:rotate(-120deg)}to{transform:rotate(108deg)}}.bar{transform-box:fill-box;transform-origin:left;animation:br 6s linear infinite}@keyframes br{from{transform:scaleX(.1)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="1200" height="640" fill="#E4E9F0"/><rect x="60" y="60" width="520" height="520" rx="40" fill="#E4E9F0" filter="url(#up)"/><circle cx="170" cy="170" r="62" fill="#E4E9F0" filter="url(#up)"/><circle cx="170" cy="170" r="48" fill="#E4E9F0" filter="url(#in)"/><text x="170.0" y="184.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#5B7CFA" text-anchor="middle" >