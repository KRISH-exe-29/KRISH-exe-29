<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="30 minutes of paperwork became 30 seconds. 9 apps in production, 128 tests, rank 7 of 1500+, 1 patent filed."><title>30 minutes of paperwork became 30 seconds. 9 apps in production, 128 tests, rank 7 of 1500+, 1 patent filed.</title><defs></defs><style>.arrow{animation:ar 1.4s ease-in-out infinite}@keyframes ar{50%{transform:translateX(30px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="1200" height="700" fill="#0D0D0D"/><text x="30.0" y="250.0" font-family="'Arial Black', 'Helvetica Neue', Impact, Arial, sans-serif" font-size="220" font-weight="900" fill="#FAFAF7" text-anchor="start" letter-spacing="-14">30</text><text x="310.0" y="160.0" font-family="'Playfair Display', Didot, 'Bodoni MT', Georgia, serif" font-size="28" font-weight="400" fill="#6A6A64" text-anchor="start" font-style="italic">minutes of MCC</text><text x="310.0" y="198.0" font-family="'Playfair Display', Didot, 'Bodoni MT', Georgia, serif" font-size="28" font-weight="400" fill="#6A6A64" text-anchor="start" font-style="italic">paperwork, before.</text><g class="arrow"><text x="560" y="228" font-family="'Arial Black', 'Helvetica Neue', Impact, Arial, sans-serif" font-size="150" fill="#FF5A1F">→</text></g><text x="1170.0" y="250.0" font-family="'Arial Black', 'Helvetica Neue', Impact, Arial, sans-serif" font-size="220" font-weight="900" fill="#FF5A1F" text-anchor="end" letter-spacing="-14">30s</text><line x1="30" x2="1170" y1="300" y2="300" stroke="#FAFAF7" stroke-width="4"/><text x="30.0" y="520.0" font-family="'Arial Black', 'Helvetica Neue', Impact, Arial, sans-serif" font-size="170" font-weight="900" fill="none" text-anchor="start" letter-spacing="-8" stroke="#FAFAF7" stroke-width="3">9</text><text x="34.0" y="572.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="400" fill="#6A6A64" text-anchor="start" letter-spacing="2">APPS IN PRODUCTION</text><text x="320.0" y="520.0" font-family="'Arial Black', 'Helvetica Neue', Impact, Arial, sans-serif" font-size="130" font-weight="900" fill="#FAFAF7" text-anchor="start" letter-spacing="-8" >128</text><text x="324.0" y="572.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="400" fill="#6A6A64" text-anchor="start" letter-spacing="2">TESTS GUARD DISPATCH</text><text x="610.0" y="520.0" font-family="'Arial Black', 'Helvetica Neue', Impact, Arial, sans-serif" font-size="170" font-weight="900" fill="none" text-anchor="start" letter-spacing="-8" stroke="#FAFAF7" stroke-width="3">#7</text><text x="614.0" y="572.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="400" fill="#6A6A64" text-anchor="start" letter-spacing="2">OF 1500+ COLLEGES</text><text x="900.0" y="520.0" font-family="'Arial Black', 'Helvetica Neue', Impact, Arial, sans-serif" font-size="170" font-weight="900" fill="#FAFAF7" text-anchor="start" letter-spacing="-8" >1</text><text x="904.0" y="572.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="400" fill="#6A6A64" text-anchor="start" letter-spacing="2">PATENT FILED</text><text x="30.0" y="660.0" font-family="'Playfair Display', Didot, 'Bodoni MT', Georgia, serif" font-size="26" font-weight="400" fill="#FAFAF7" text-anchor="start" font-style="italic">Numbers do the talking. I just write the scripts that move them.</text></svg>
