<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="I build, test, ship and delete things factories run on."><title>I build, test, ship and delete things factories run on.</title><defs></defs><style>.v{opacity:0;animation:vv 8s infinite}.v0{opacity:1}.v1{animation-delay:2s}.v2{animation-delay:4s}.v3{animation-delay:6s}@keyframes vv{0%{opacity:0;transform:translateY(200px)}5%,22%{opacity:1;transform:none}27%,100%{opacity:0;transform:translateY(-200px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="1200" height="640" fill="#FAFAF7"/><text x="40.0" y="60.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#9A9A92" text-anchor="start" letter-spacing="3">KRISHNA RAJU S — A PROFILE SET IN TYPE</text><text x="30.0" y="220.0" font-family="'Arial Black', 'Helvetica Neue', Impact, Arial, sans-serif" font-size="190" font-weight="900" fill="#0D0D0D" text-anchor="start" >I</text><clipPath id="vb"><rect x="130" y="50" width="1060" height="200"/></clipPath><g clip-path="url(#vb)"><g class="v v0"><text x="150" y="220" font-family="'Arial Black', 'Helvetica Neue', Impact, Arial, sans-serif" font-size="190" font-weight="900" fill="#FF3D00" letter-spacing="-8">BUILD</text></g><g class="v v1"><text x="150" y="220" font-family="'Arial Black', 'Helvetica Neue', Impact, Arial, sans-serif" font-size="190" font-weight="900" fill="#FF3D00" letter-spacing="-8">TEST</text></g><g class="v v2"><text x="150" y="220" font-family="'Arial Black', 'Helvetica Neue', Impact, Arial, sans-serif" font-size="190" font-weight="900" fill="#FF3D00" letter-spacing="-8">SHIP</text></g><g class="v v3"><text x="150" y="220" font-family="'Arial Black', 'Helvetica Neue', Impact, Arial, sans-serif" font-size="190" font-weight="900" fill="#FF3D00" letter-spacing="-8">DELETE</text></g></g><text x="30.0" y="400.0" font-family="'Arial Black