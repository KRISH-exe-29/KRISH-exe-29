nt-size="56" font-weight="400" fill="#E6E0E9" text-anchor="start" letter-spacing="-.5">Electrical engineer.</text><text x="48.0" y="216.0" font-family="Roboto, 'Google Sans', 'Segoe UI', Arial, sans-serif" font-size="56" font-weight="400" fill="#E6E0E9" text-anchor="start" letter-spacing="-.5">Builds the software</text><text x="48.0" y="282.0" font-family="Roboto, 'Google Sans', 'Segoe UI', Arial, sans-serif" font-size="56" font-weight="500" fill="#D0BCFF" text-anchor="start" letter-spacing="-.5">factories run on.</text><text x="48.0" y="330.0" font-family="Roboto, 'Google Sans', 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" fill="#CAC4D0" text-anchor="start" >Nine apps in production at Indo Tech Transformers. One</text><text x="48.0" y="359.0" font-family="Roboto, 'Google Sans', 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" fill="#CAC4D0" text-anchor="start" >patent filed. A habit of turning 30-minute chores into</text><text x="48.0" y="388.0" font-family="Roboto, 'Google Sans', 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" fill="#CAC4D0" text-anchor="start" >30-second taps.</text><rect x="48" y="420" width="159" height="36" rx="8" fill="none" stroke="#49454F"/><text x="62.0" y="444.0" font-family="Roboto, 'Google Sans', 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#E6E0E9" text-anchor="start" >⚡ EEE engineer</text><rect x="216.79999999999998" y="420" width="159" height="36" rx="8" fill="none" stroke="#49454F"/><text x="230.8" y="444.0" font-family="Roboto, 'Google Sans', 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#E6E0E9" text-anchor="start" >📜 Patent filed</text><rect x="385.59999999999997" y="420" width="177" height="36" rx="8" fill="none" stroke="#49454F"/><text x="399.6" y="444.0" font-family="Roboto, 'Google Sans', 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#E6E0E9" text-anchor="start" >🏆 NEC #7 / 1500+</text><rect x="572.8" y="420" width="131" height="36" rx="8" fill="none" stroke="#49454F"/><text x="586.8" y="444.0" font-family="Roboto, 'Google Sans', 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#E6E0E9" text-anchor="start" >🎓 CGPA 8.38</text><rect x="760" y="110" width="380" height="380" rx="28" fill="#211F26" filter="url(#e1)"/><circle cx="950" cy="210" r="64" fill="#4F378B"/><text x="950.0" y="232.0" font-family="Roboto, 'Google Sans', 'Segoe UI', Arial, sans-serif" font-size="54" font-weight="500" fill="#EADDFF" text-anchor="middle" >KR</text><text x="950.0" y="316.0" font-family="Roboto, 'Google Sans', 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="500" fill="#E6E0E9" text-anchor="middle" >Krishna Raju S</text><text x="950.0" y="344.0" font-family="Roboto, 'Google Sans', 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#CAC4D0" text-anchor="middle" >Chennai · Indo Tech Transformers</text><rect x="800" y="372" width="300" height="6" rx="3" fill="#2B2930"/><rect class="prog" x="800" y="372" width="294" height="6" rx="3" fill="#D0BCFF"/><text x="800.0" y="404.0" font-family="Roboto, 'Google Sans', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#CAC4D0" text-anchor="start" >Manual time deleted</text><text x="1100.0" y="404.0" font-family="Roboto, 'Google Sans', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#D0BCFF" text-anchor="end" >98%</text><rect x="800" y="424" width="140" height="44" rx="22" fill="#D0BCFF"/><rect x="956" y="424" width="144" height="44" rx="22" fill="none" stroke="#49454F"/><text x="870.0" y="452.0" font-family="Roboto, 'Google Sans', 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" fill="#381E72" text-anchor="middle" >Hire</text><text x="1028.0" y="452.0" font-family="Roboto, 'Google Sans', 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" fill="#D0BCFF" text-anchor="middle" >Projects</text><g filter="url(#e3)"><rect x="1064" y="508"