<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="An ASCII stick figure dancing: me when the deploy goes green.">
<title>An ASCII stick figure dancing: me when the deploy goes green.</title>
<style>.f{opacity:0;animation-duration:1.76s;animation-iteration-count:infinite;animation-timing-function:step-end}#pup{animation-name:kpup}@keyframes kpup{0%{opacity:0}0.000%{opacity:1}12.500%{opacity:0}25.000%{opacity:1}37.500%{opacity:0}}#pleft{animation-name:kpleft}@keyframes kpleft{0%{opacity:0}12.500%{opacity:1}25.000%{opacity:0}}#pright{animation-name:kpright}@keyframes kpright{0%{opacity:0}37.500%{opacity:1}50.000%{opacity:0}}#prest{animation-name:kprest}@keyframes kprest{0%{opacity:0}50.000%{opacity:1}62.500%{opacity:0}}#pflat{animation-name:kpflat}@keyframes kpflat{0%{opacity:0}62.500%{opacity:1}75.000%{opacity:0}87.500%{opacity:1}100.000%{opacity:0}}#pkick{animation-name:kpkick}@keyframes kpkick{0%{opacity:0}75.000%{opacity:1}87.500%{opacity:0}}@media (prefers-reduced-motion: reduce){.f{animation:none!important;opacity:0}.still{opacity:1}*{animation:none!important}}</style>
<rect width="1200" height="200" fill="#0D1117"/>
<g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="40" font-weight="700" fill="#E6EDF3"><g id="pup" class="f still"><text x="96" y="78" xml:space="preserve">\o/</text><text x="96" y="118" xml:space="preserve"> | </text><text x="96" y="158" xml:space="preserve">/ \ </text></g><g id="pleft" class="f"><text x="96" y="78" xml:space="preserve">_o/</text><text x="96" y="118" xml:space="preserve"> | </text><text x="96" y="158" xml:space="preserve">/ &gt;</text></g><g id="pright" class="f"><text x="96" y="78" xml:space="preserve">\o_</text><text x="96" y="118" xml:space="preserve"> | </text><text x="96" y="158" xml:space="preserve">&lt; \ </text></g><g id="prest" class="f"><text x="96" y="78" xml:space="preserve"> o </text><text x="96" y="118" xml:space="preserve">/|\ </text><text x="96" y="158" xml:space="preserve">/ \ </text></g><g id="pflat" class="f"><text x="96" y="78" xml:space="preserve">_o_</text><text x="96" y="118" xml:space="preserve"> | </text><text x="96" y="158" xml:space="preserve">/ \ </text></g><g id="pkick" class="f"><text x="96" y="78" xml:space="preserve"> o/</text><text x="96" y="118" xml:space="preserve">/| </text><text x="96" y="158" xml:space="preserve"> |\_</text></g></g>
<line x1="78" x2="200" y1="176" y2="176" stroke="#8D96A0" stroke-width="3" stroke-linecap="round"/>
<text x="300" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="38" font-weight="300" fill="#E6EDF3" letter-spacing="-1">me, every time a deploy goes <tspan font-weight="600" fill="#FF8A5B">green</tspan>.</text>
<text x="302" y="138" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" fill="#8D96A0">// so, roughly every day.</text>
</svg>
