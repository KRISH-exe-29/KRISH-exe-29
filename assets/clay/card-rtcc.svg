<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" role="img" aria-label="RTCC &amp; M.Box Tracker: Chases pending points so nobody has to. Polite follow-up emails every 48 hours."><title>RTCC &amp; M.Box Tracker: Chases pending points so nobody has to. Polite follow-up emails every 48 hours.</title><defs><linearGradient id="board" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F1EAFB"/><stop offset="1" stop-color="#FBEFEA"/></linearGradient>
<filter id="clay" x="-15%" y="-15%" width="135%" height="145%">
  <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="b"/>
  <feOffset in="b" dx="-6" dy="-8" result="up"/>
  <feComposite in="SourceAlpha" in2="up" operator="arithmetic" k2="1" k3="-1" result="rimBR"/>
  <feFlood flood-color="#6E56A8" flood-opacity=".28"/><feComposite in2="rimBR" operator="in" result="shade"/>
  <feOffset in="b" dx="6" dy="8" result="down"/>
  <feComposite in="SourceAlpha" in2="down" operator="arithmetic" k2="1" k3="-1" result="rimTL"/>
  <feFlood flood-color="#fff" flood-opacity=".85"/><feComposite in2="rimTL" operator="in" result="light"/>
  <feGaussianBlur in="SourceAlpha" stdDeviation="11"/><feOffset dx="9" dy="14" result="ds"/>
  <feFlood flood-color="#6E56A8" flood-opacity=".26"/><feComposite in2="ds" operator="in" result="drop"/>
  <feMerge><feMergeNode in="drop"/><feMergeNode in="SourceGraphic"/><feMergeNode in="shade"/><feMergeNode in="light"/></feMerge>
</filter></defs><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="600" height="340" rx="34" fill="url(#board)"/><rect x="24" y="24" width="552" height="292" rx="34" fill="#FFE7A6" filter="url(#clay)"/>
<rect x="52" y="52" width="64" height="64" rx="22" fill="#FFFFFF" filter="url(#clay)"/><text x="84" y="95" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI Variable Display', 'Segoe UI', Nunito, system-ui, sans-serif" font-size="30" font-weight="400" fill="#2B2140" text-anchor="middle" >🧰</text>
<text x="134" y="80" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI Variable Display', 'Segoe UI', Nunito, system-ui, sans-serif" font-size="26" font-weight="800" fill="#2B2140" text-anchor="start" >RTCC &amp; M.Box Tracker</text>
<g transform="translate(134,92)"><rect x="0" y="0" width="73.68" height="40" rx="20" fill="#BDEBD6" filter="url(#clay)"/><text x="36.84" y="26" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI Variable Display', 'Segoe UI', Nunito, system-ui, sans-serif" font-size="13" font-weight="600" fill="#2B2140" text-anchor="middle" >IN USE</text></g>
