<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="You bring the boring process. I'll bring the button. krishnarajus2004@gmail.com"><title>You bring the boring process. I'll bring the button. krishnarajus2004@gmail.com</title><defs><linearGradient id="board" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F1EAFB"/><stop offset="1" stop-color="#FBEFEA"/></linearGradient>
<filter id="clay" x="-15%" y="-15%" width="135%" height="145%">
  <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="b"/>
  <feOffset in="b" dx="-6" dy="-8" result="up"/>
  <feComposite in="SourceAlpha" in2="up" operator="arithmetic" k2="1" k3="-1" result="rimBR"/>
  <feFlood flood-color="#6E56A8" flood-opacity=".28"/><feComposite in2="rimBR" operator="in" result="shade"/>
  <feOffset in="b" dx="6" dy="8" result="down"/>
