  <feFlood flood-color="#6E56A8" flood-opacity=".26"/><feComposite in2="ds" operator="in" result="drop"/>
  <feMerge><feMergeNode in="drop"/><feMergeNode in="SourceGraphic"/><feMergeNode in="shade"/><feMergeNode in="light"/></feMerge>
</filter></defs><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="1200" height="300" rx="34" fill="url(#board)"/><rect x="48" y="40" width="1104" height="220" rx="40" fill="#D9CBFA" filter="url(#clay)"/>
