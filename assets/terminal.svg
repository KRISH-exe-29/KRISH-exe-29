  <text x="30" y="100" clip-path="url(#c1)" fill="#e6f7ff">krishna — builds the software a transformer factory actually runs on</text>
  <clipPath id="c2"><rect x="28" y="110" height="22" width="0">
    <animate attributeName="width" dur="16s" repeatCount="indefinite" values="0;0;172;172;0" keyTimes="0;0.130;0.205;.97;1"/></rect></clipPath>
  <text x="30" y="126" clip-path="url(#c2)" fill="#00e5ff"><tspan fill="#ff7b72">$</tspan> cat philosophy.txt</text>
  <clipPath id="c3"><rect x="28" y="136" height="22" width="0">
    <animate attributeName="width" dur="16s" repeatCount="indefinite" values="0;0;432;432;0" keyTimes="0;0.221;0.243;.97;1"/></rect></clipPath>
  <text x="30" y="152" clip-path="url(#c3)" fill="#ffd166">if a human does it twice, a script does it forever.</text>
  <clipPath id="c4"><rect x="28" y="162" height="22" width="0">
    <animate attributeName="width" dur="16s" repeatCount="indefinite" values="0;0;239;239;0" keyTimes="0;0.280;0.385;.97;1"/></rect></clipPath>
  <text x="30" y="178" clip-path="url(#c4)" fill="#00e5ff"><tspan fill="#ff7b72">$</tspan> ls ~/shipped --sort=impact</text>
  <clipPath id="c5"><rect x="28" y="188" height="22" width="0">
    <animate attributeName="width" dur="16s" repeatCount="indefinite" values="0;0;650;650;0" keyTimes="0;0.401;0.422;.97;1"/></rect></clipPath>
  <text x="30" y="204" clip-path="url(#c5)" fill="#7ee787">dispatch-system/  job-lens/  rtcc-mbox/  data-acq/  epms/  dmat/  fasteners/</text>
  <clipPath id="c6"><rect x="28" y="214" height="22" width="0">
