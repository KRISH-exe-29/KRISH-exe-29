<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Hire me. Or don't. The scripts run anyway. krishnarajus2004@gmail.com"><title>Hire me. Or don't. The scripts run anyway. krishnarajus2004@gmail.com</title><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#F4F1E812" stroke-width="2"/></pattern></defs><style>.wob{animation:wob 3.2s ease-in-out infinite}@keyframes wob{50%{transform:rotate(4deg) scale(1.05)}}.cur{animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="1200" height="330" fill="#121212"/><rect width="1200" height="330" fill="url(#grid)"/><text x="600" y="108" font-family="'Arial Black', 'Archivo Black', Impact, 'Helvetica Neue', Arial, sans-serif" font-size="84" font-weight="900" fill="#F4F1E8" text-anchor="middle" letter-spacing="-3">HIRE ME.</text><text x="600" y="168" font-family="'Arial Black', 'Archivo Black', Impact, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="900" fill="#F4F1E8" text-anchor="middle" >OR DON'T. THE SCRIPTS RUN ANYWAY.</text><rect x="308" y="214" width="600" height="64" fill="#F4F1E8"/><rect x="300" y="206" width="600" height="64" fill="#FFD93D" stroke="#F4F1E8" stroke-width="4"/><text x="600" y="248" font-family="'Courier New', ui-monospace, Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#111111" text-anchor="middle" >krishnarajus2004@gmail.com </text><rect class="cur" x="866" y="226" width="14" height="28" fill="#111111"/><rect x="2" y="2" width="1196" height="326" fill="none" stroke="#F4F1E8" stroke-width="4"/></svg>
