<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="The receipts: 9 apps in production; 128 tests guarding dispatch; 30m→30s one chore, automated; #7 of 1500+ colleges"><title>The receipts: 9 apps in production; 128 tests guarding dispatch; 30m→30s one chore, automated; #7 of 1500+ colleges</title><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#F4F1E812" stroke-width="2"/></pattern></defs><style>.wob{animation:wob 3.2s ease-in-out infinite}@keyframes wob{50%{transform:rotate(4deg) scale(1.05)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="1200" height="300" fill="#121212"/><rect width="1200" height="300" fill="url(#grid)"/><text x="40" y="80" font-family="'Arial Black', 'Archivo Black', Impact, 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="900" fill="#F4F1E8" text-anchor="start" letter-spacing="-2">THE RECEIPTS</text><text x="1160" y="80" font-family="'Courier New', ui-monospace, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#F4F1E8" text-anchor="end" >(NOT VIBES. NUMBERS.)</text><rect x="50.0" y="122" width="259.0" height="150" fill="#F4F1E8"/><rect x="40.0" y="112" width="259.0" height="150" fill="#FFD93D" stroke="#F4F1E8" stroke-width="4"/><text x="62.0" y="196" font-family="'Arial Black', 'Archivo Black', Impact, 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="900" fill="#111111" text-anchor="start" letter-spacing="-2">9</text><text x="62.0" y="238" font-family="'Courier New', ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#111111" text-anchor="start" >APPS IN PRODUCTION</text><rect x="337.0" y="122" width="259.0" height="150" fill="#F4F1E8"/><rect x="327.0" y="112" width="259.0" height="150" fill="#FF6B9D" stroke="#F4F1E8" stroke-width="4"/><text x="349.0" y="196" font-family="'Arial Black', 'Archivo Black', Impact, 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="900" fill="#111111" text-anchor="start" letter-spacing="-2">128</text><text x="349.0" y="238" font-family="'Courier New', ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#111111" text-anchor="start" >TESTS GUARDING DISPATCH</text><rect x="624.0" y="122" width="259.0" height="150" fill="#F4F1E8"/><rect x="614.0" y="112" width="259.0" height="150" fill="#4D96FF" stroke="#F4F1E8" stroke-width="4"/><text x="636.0" y="196" font-family="'Arial Black', 'Archivo Black', Impact, 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="900" fill="#111111" text-anchor="start" letter-spacing="-2">30m→30s</text><text x="636.0" y="238" font-family="'Courier New', ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#111111" text-anchor="start" >ONE CHORE, AUTOMATED</text><rect x="911.0" y="122" width="259.0" height="150" fill="#F4F1E8"/><rect x="901.0" y="112" width="259.0" height="150" fill="#6BCB77" stroke="#F4F1E8" stroke-width="4"/><text x="923.0" y="196" font-family="'Arial Black', 'Archivo Black', Impact, 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="900" fill="#111111" text-anchor="start" letter-spacing="-2">#7</text><text x="923.0" y="238" font-family="'Courier New', ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#111111" text-anchor="start" >OF 1500+ COLLEGES</text><rect x="2" y="2" width="1196" height="296" fill="none" stroke="#F4F1E8" stroke-width="4"/></svg>
