<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="Job Lens: 100 resumes in. A ranked shortlist out. Rubric scoring · ATS checks · offline AI"><title>Job Lens: 100 resumes in. A ranked shortlist out. Rubric scoring · ATS checks · offline AI</title><defs><clipPath id="all"><rect width="600" height="300" rx="36"/></clipPath>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="42"/></filter>
<filter id="refract" x="-10%" y="-10%" width="120%" height="120%">
  <feTurbulence type="fractalNoise" baseFrequency=".006 .01" numOctaves="2" seed="4" result="n"/>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="70" xChannelSelector="R" yChannelSelector="G" result="d"/>
  <feGaussianBlur in="d" stdDeviation="10"/>
</filter>
<filter id="lift" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity=".22"/></filter>
<linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.45"/>
  <stop offset=".45" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity="0.27"/></linearGradient>
<linearGradient id="spec" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="ink" x1="0" x2="1"><stop offset="0" stop-color="#F5F7FF"/><stop offset="1" stop-color="#8FA5FF"/></linearGradient>
<g id="wall"><rect width="600" height="300" fill="#05070F"/><g filter="url(#soft)"><circle class="b b0" cx="492" cy="60" r="192" fill="#3A5BFF" opacity="0.5"/><circle class="b b1" cx="420" cy="255" r="192" fill="#D946EF" opacity="0.5"/><circle class="b b2" cx="150" cy="270" r="192" fill="#14B8A6" opacity="0.5"/><circle class="b b3" cx="108" cy="75" r="192" fill="#F59E0B" opacity="0.5"/></g></g></defs><style>.b{transform-box:fill-box;transform-origin:center;animation:drift 16s ease-in-out infinite alternate}.b1{animation-duration:21s;animation-delay:-5s}.b2{animation-duration:25s;animation-delay:-9s}.b3{animation-duration:19s;animation-delay:-13s}@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-8%,6%) scale(1.12)}100%{transform:translate(7%,-5%) scale(.92)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g clip-path="url(#all)"><use href="#wall"/><clipPath id="g1"><rect x="18" y="18" width="564" height="264" rx="30"/></clipPath>
<g filter="url(#lift)"><rect x="18" y="18" width="564" height="264" rx="30" fill="#05070F"/></g>
<g clip-path="url(#g1)"><use href="#wall" filter="url(#refract)"/>
  <rect x="18" y="18" width="564" height="264" fill="#0A0E1C" opacity="0.5"/>
  <rect x="18" y="18" width="564" height="90" fill="url(#spec)" opacity=".5"/></g>
<rect x="18.75" y="18.75" width="562.5" height="262.5" rx="30" fill="none" stroke="url(#rim)" stroke-width="1.5"/><clipPath id="g2"><rect x="46" y="46" width="60" height="60" rx="18"/></clipPath>
<g ><rect x="46" y="46" width="60" height="60" rx="18" fill="#05070F"/></g>
<g clip-path="url(#g2)"><use href="#wall" filter="url(#refract)"/>
  <rect x="46" y="46" width="60" height="60" fill="#0A0E1C" opacity="0.5"/>
  <rect x="46" y="46" width="60" height="27" fill="url(#spec)" opacity=".5"/></g>
<rect x="46.75" y="46.75" width="58.5" height="58.5" rx="18" fill="none" stroke="url(#rim)" stroke-width="1.5"/><text x="76" y="87" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Display', 'Segoe UI', Inter, system-ui, sans-serif" font-size="30" font-weight="400" fill="#F5F7FF" text-anchor="middle" >🔍</text><text x="126" y="74" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Display', 'Segoe UI', Inter, system-ui, sans-serif" font-size="25" font-weight="700" fill="#F5F7FF" text-anchor="start" letter-spacing="-.3">Job Lens</text><text x="126" y="100" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#8FA5FF" text-anchor="start" letter-spacing="1.5">LIVE DEMO</text><text x="46" y="160" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Display', 'Segoe UI', Inter, system-ui, sans-serif" font-size="21" font-weight="600" fill="#F5F7FF" text-anchor="start" >100 resumes in. A ranked shortlist out.</text><text x="46" y="192" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Display', 'Segoe UI', Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#C9D0E4" text-anchor="start" >Rubric scoring · ATS checks · offline AI</text><text x="46" y="248" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="500" fill="#C9D0E4" text-anchor="start" >TypeScript · Transformers.js · OCR</text></g></svg>
