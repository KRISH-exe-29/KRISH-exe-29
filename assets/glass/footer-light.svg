<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Your next quick manual step is my next app. krishnarajus2004@gmail.com"><title>Your next quick manual step is my next app. krishnarajus2004@gmail.com</title><defs><clipPath id="all"><rect width="1200" height="280" rx="36"/></clipPath>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="84"/></filter>
<filter id="refract" x="-10%" y="-10%" width="120%" height="120%">
  <feTurbulence type="fractalNoise" baseFrequency=".006 .01" numOctaves="2" seed="4" result="n"/>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="70" xChannelSelector="R" yChannelSelector="G" result="d"/>
  <feGaussianBlur in="d" stdDeviation="10"/>
</filter>
<filter id="lift" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#3B4A7A" flood-opacity=".22"/></filter>
<linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
  <stop offset=".45" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity="0.57"/></linearGradient>
<linearGradient id="spec" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="ink" x1="0" x2="1"><stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#3B5BFF"/></linearGradient>
<g id="wall"><rect width="1200" height="280" fill="#E9F0FF"/><g filter="url(#soft)"><circle class="b b0" cx="984" cy="56" r="384" fill="#7CC6FE" opacity="0.85"/><circle class="b b1" cx="840" cy="238" r="384" fill="#FF9EC7" opacity="0.85"/><circle class="b b2" cx="300" cy="252" r="384" fill="#FFD27A" opacity="0.85"/><circle class="b b3" cx="216" cy="70" r="384" fill="#A79BFF" opacity="0.85"/></g></g></defs><style>.b{transform-box:fill-box;transform-origin:center;animation:drift 16s ease-in-out infinite alternate}.b1{animation-duration:21s;animation-delay:-5s}.b2{animation-duration:25s;animation-delay:-9s}.b3{animation-duration:19s;animation-delay:-13s}@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-8%,6%) scale(1.12)}100%{transform:translate(7%,-5%) scale(.92)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g clip-path="url(#all)"><use href="#wall"/><clipPath id="g1"><rect x="40" y="30" width="1120" height="220" rx="40"/></clipPath>
<g filter="url(#lift)"><rect x="40" y="30" width="1120" height="220" rx="40" fill="#E9F0FF"/></g>
<g clip-path="url(#g1)"><use href="#wall" filter="url(#refract)"/>
  <rect x="40" y="30" width="1120" height="220" fill="#FFFFFF" opacity="0.42"/>
  <rect x="40" y="30" width="1120" height="90" fill="url(#spec)" opacity=".5"/></g>
<rect x="40.75" y="30.75" width="1118.5" height="218.5" rx="40" fill="none" stroke="url(#rim)" stroke-width="1.5"/><text x="600" y="104" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Display', 'Segoe UI', Inter, system-ui, sans-serif" font-size="28" font-weight="500" fill="#3A4358" text-anchor="middle" >Your next “quick manual step”</text><text x="600" y="160" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Display', 'Segoe UI', Inter, system-ui, sans-serif" font-size="52" font-weight="800" fill="url(#ink)" text-anchor="middle" letter-spacing="-1.5">is my next app.</text><clipPath id="g2"><rect x="467.0" y="186" width="264.96000000000004" height="38.4" rx="19.2"/></clipPath>
<g ><rect x="467.0" y="186" width="264.96000000000004" height="38.4" rx="19.2" fill="#E9F0FF"/></g>
<g clip-path="url(#g2)"><use href="#wall" filter="url(#refract)"/>
  <rect x="467.0" y="186" width="264.96000000000004" height="38.4" fill="#FFFFFF" opacity="0.42"/>
  <rect x="467.0" y="186" width="264.96000000000004" height="17" fill="url(#spec)" opacity=".5"/></g>
<rect x="467.75" y="186.75" width="263.46000000000004" height="36.9" rx="19.2" fill="none" stroke="url(#rim)" stroke-width="1.5"/><text x="599.48" y="210.8" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Display', 'Segoe UI', Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#0B1020" text-anchor="middle" >krishnarajus2004@gmail.com</text></g></svg>
