<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Krishna Raju S. Hello, factory floor. Engineered for the shop floor: electrical engineer who ships software, nine apps in production, one patent."><title>Krishna Raju S. Hello, factory floor. Engineered for the shop floor: electrical engineer who ships software, nine apps in production, one patent.</title><defs><clipPath id="all"><rect width="1200" height="600" rx="36"/></clipPath>
