<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-label="9 apps in production; 128 tests guarding dispatch; 30m→30s one chore, automated; #7 of 1500+ colleges"><title>9 apps in production; 128 tests guarding dispatch; 30m→30s one chore, automated; #7 of 1500+ colleges</title><defs><clipPath id="all"><rect width="1200" height="210" rx="36"/></clipPath>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="84"/></filter>
<filter id="refract" x="-10%" y="-10%" width="120%" height="120%">
  <feTurbulence type="fractalNoise" baseFrequency=".006 .01" numOctaves="2" seed="4" result="n"/>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="70" xChannelSelector="R" yChannelSelector="G" result="d"/>
  <feGaussianBlur in="d" stdDeviation="10"/>
</filter>
<filter id="lift" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#3B4A7A" flood-opacity=".22"/></filter>
<linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
  <stop offset=".45" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity="0.57"/></linearGradient>
<linearGradient id="spec" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="ink" x1="0" x2="1"><stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#3B5BFF"/></linearGradient>
<g id="wall"><rect width="1200" height="210" fill="#E9F0FF"/><g filter="url(#soft)"><circle class="b b0" cx="984" cy="42" r="384" fill="#7CC6FE" opacity="0.85"/><circle class="b b1" cx="840" cy="178" r="384" fill="#FF9EC7" opacity="0.85"/><circle class="b b2" cx="300" cy="189" r="384" fill="#FFD27A" opacity="0.85"/><circle class="b b3" cx="216" cy="52" r="384" fill="#A79BFF" opacity="0.85"/></g></g></defs><style>.b{transform-box:fill-box;transform-origin:center;animation:drift 16s ease-in-out infinite alternate}.b1{animation-duration:21s;animation-delay:-5s}.b2{animation-duration:25s;animation-delay:-9s}.b3{animation-duration:19s;animation-delay:-13s}@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-8%,6%) scale(1.12)}100%{transform:translate(7%,-5%) scale(.92)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g clip-path="url(#all)"><use href="#wall"/><clipPath id="g1"><rect x="40.0" y="30" width="265.0" height="150" rx="30"/></clipPath>
<g filter="url(#lift)"><rect x="40.0" y="30" width="265.0" height="150" rx="30" fill="#E9F0FF"/></g>
