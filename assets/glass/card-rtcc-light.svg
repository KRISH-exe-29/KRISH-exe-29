<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="RTCC &amp; M.Box Tracker: Chases pending points so nobody has to. 48-hour follow-ups · role-based"><title>RTCC &amp; M.Box Tracker: Chases pending points so nobody has to. 48-hour follow-ups · role-based</title><defs><clipPath id="all"><rect width="600" height="300" rx="36"/></clipPath>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="42"/></filter>
<filter id="refract" x="-10%" y="-10%" width="120%" height="120%">
  <feTurbulence type="fractalNoise" baseFrequency=".006 .01" numOctaves="2" seed="7" result="n"/>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="70" xChannelSelector="R" yChannelSelector="G" result="d"/>
  <feGaussianBlur in="d" stdDeviation="10"/>
</filter>
<filter id="lift" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#3B4A7A" flood-opacity=".22"/></filter>
<linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
  <stop offset=".45" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity="0.57"/></linearGradient>
<linearGradient id="spec" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="ink" x1="0" x2="1"><stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#3B5BFF"/></linearGradient>
<g id="wall"><rect width="600" height="300" fill="#E9F0FF"/><g filter="url(#soft)"><circle class="b b0" cx="108" cy="75" r="192" fill="#7CC6FE" opacity="0.85"/><circle class="b b1" cx="492" cy="60" r="192" fill="#FF9EC7" opacity="0.85"/><circle class="b b2" cx="420" cy="255" r="192" fill="#FFD27A" opacity="0.85"/><circle class="b b3" cx="150" cy="270" r="192" fill="#A79BFF" opacity="0.85"/></g></g></defs><style>.b{transform-box:fill-box;transform-origin:center;animation:drift 16s ease-in-out infinite alternate}.b1{animation-duration:21s;animation-delay:-5s}.b2{animation-duration:25s;animation-delay:-9s}.b3{animation-duration:19s;animation-delay:-13s}@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-8%,6%) scale(1.12)}100%{transform:translate(7%,-5%) scale(.92)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g clip-path="url(#all)"><use href="#wall"/><clipPath id="g1"><rect x="18" y="18" width="564" height="264" rx="30"/></clipPath>
<g filter="url(#lift)"><rect x="18" y="18" width="564" height="264" rx="30" fill="#E9F0FF"/></g>
<g clip-path="url(#g1)"><use href="#wall" filter="url(#refract)"/>
  <rect x="18" y="18" width="564" height="264" fill="#FFFFFF" opacity="0.42"/>
  <rect x="18" y="18" width="564" height="90" fill="url(#spec)" opacity=".5"/></g>
<rect x="18.75" y="18.75" width="562.5" height="262.5" rx="30" fill="none" stroke="url(#rim)" stroke-width="1.5"/><clipPath id="g2"><rect x="46" y="46" width="60" height="60" rx="18"/></clipPath>
<g ><rect x="46" y="46" width="60" height="60" rx="18" fill="#E9F0FF"/></g>
<g clip-path="url(#g2)"><use href="#wall" filter="url(#refract)"/>
  <rect x="46" y="46" width="60" height="60" fill="#FFFFFF" opacity="0.42"/>
  <rect x="46" y="46" width="60" height="27" fill="url(#spec)" opacity=".5"/></g>
<rect x="46.75" y="46.75" width="58.5" height="58.5" rx="18" fill="none" stroke="url(#rim)" stroke-width="1.5"/><text x="76" y="87" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Display', 'Segoe UI', Inter, system-ui, sans-serif" font-size="30" font-weight="400" fill="#0B1020" text-anchor="middle" >🧰</text><text x="126" y="74" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Display', 'Segoe UI', Inter, system-ui, sans-serif" font-size="25" font-weight="700" fill="#0B1020" text-anchor="start" letter-spacing="-.3">RTCC &amp; M.Box Tracker</text><text x="126" y="100" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#3B5BFF" text-anchor="start" letter-spacing="1.5">IN USE</text><text x="46" y="160" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Display', 'Segoe UI', Inter, system-ui, sans-serif" font-size="21" font-weight="600" fill="#0B1020" text-anchor="start" >Chases pending points so nobody has to.</text><text x="46" y="192" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Display', 'Segoe UI', Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#3A4358" text-anchor="start" >48-hour follow-ups · role-based</text><text x="46" y="248" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="500" fill="#3A4358" text-anchor="start" >React · Express · node-cron</text></g></svg>
