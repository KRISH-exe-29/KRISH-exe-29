">MCC panels for 8–10 TPH plants: DOL · VFD · soft-starter feeders, I/O cards.</text><text x="276" y="351" font-family="'Courier New', Courier, 'Nimbus Mono PS', monospace" font-size="15" font-weight="700" fill="#0B6E4F">✔ Built a Python tool: 30 min of paperwork → 30 s</text><text x="276" y="378" font-family="'Courier New', Courier, 'Nimbus Mono PS', monospace" font-size="19" font-weight="700" fill="#1B1B1B">INOVATE TECHNOLOGIES</text><text x="990" y="378" text-anchor="end" font-family="'Courier New', Courier, 'Nimbus Mono PS', monospace" font-size="16" fill="#3A3A3A">Mar – Jun 2024 · Chennai</text><text x="276" y="402" font-family="'Courier New', Courier, 'Nimbus Mono PS', monospace" font-size="16" fill="#1F4E99">Full Stack Developer Intern</text><text x="276" y="426" font-family="'Courier New', Courier, 'Nimbus Mono PS', monospace" font-size="15" fill="#333">Shipped Project Phantom end to end in HTML, CSS and JavaScript.</text><text x="276" y="450" font-family="'Courier New', Courier, 'Nimbus Mono PS', monospace" font-size="15" font-weight="700" fill="#0B6E4F">✔ First production deploy</text><text x="276" y="477" font-family="'Courier New', Courier, 'Nimbus Mono PS', monospace" font-size="19" font-weight="700" fill="#1B1B1B">METTUR THERMAL POWER PLANT</text><text x="990" y="477" text-anchor="end" font-family="'Courier New', Courier, 'Nimbus Mono PS', monospace" font-size="16" fill="#3A3A3A">Jun – Jul 2024 · Tamil Nadu</text><text x="276" y="501" font-family="'Courier New', Courier, 'Nimbus Mono PS', monospace" font-size="16" fill="#1F4E99">Electrical Intern</text><text x="276" y="525" font-family="'Courier New', Courier, 'Nimbus Mono PS', monospace" font-size="15" fill="#333">Inspected generation-side electrical systems and wrote the reports.</text><text x="276" y="549" font-family="'Courier New', Courier, 'Nimbus Mono PS', monospace" font-size="15" font-weight="700" fill="#0B6E4F">✔ Saw megawatts up close</text><text x="276" y="576" font-family="'Courier New', Courier, 'Nimbus Mono PS', monospace" font-size="19" font-weight="700" fill="#1B1B1B">SOUTHERN RAILWAY</text><text x="990" y="576" text-anchor="end" font-family="'Courier New', Courier, 'Nimbus Mono PS', monospace" font-size="16" fill="#3A3A3A">Jan 2023 · Chennai</text><text x="276" y="600" font-family="'Courier New', Courier, 'Nimbus Mono PS', monospace" font-size="16" fill="#1F4E99">Electrical Intern</text><text x="276" y="624" font-family="'Courier New', Courier, 'Nimbus Mono PS', monospace" font-size="15" fill="#333">Electrical documentation and quality inspection on the railway side.</text><text x="276" y="648" font-family="'Courier New', Courier, 'Nimbus Mono PS', monospace" font-size="15" font-weight="700" fill="#0B6E4F">✔ Where it started</text><g transform="rotate(-10 880 112)" opacity=".85"><rect x="790" y="82" width="190" height="56" rx="8" fill="none" stroke="#C1121F" stroke-width="5"/><text x="885" y="121" text-anchor="middle" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#C1121F" letter-spacing="2">APPROVED</text></g></svg>
