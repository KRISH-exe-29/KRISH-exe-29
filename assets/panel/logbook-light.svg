<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Shift log: Indo Tech Transformers, Engineer, Testing &amp; Projects → Digitalisation, 2026 – now: Started in IEC 60076 testing (SFRA, PD, OLTC). Now writes the plant's software.; Bühler India, Automation Hardware Engineering Intern, Jun 2025: MCC panels for 8–10 TPH plants: DOL · VFD · soft-starter feeders, I/O cards.; Inovate Technologies, Full Stack Developer Intern, Mar – Jun 2024: Shipped Project Phantom end to end in HTML, CSS and JavaScript.; Mettur Thermal Power Plant, Electrical Intern, Jun – Jul 2024: Inspected generation-side electrical systems and wrote the reports.; Southern Railway, Electrical Intern, Jan 2023: Electrical documentation and quality inspection on the railway side."><title>Shift log: Indo Tech Transformers, Engineer, Testing &amp; Projects → Digitalisation, 2026 – now: Started in IEC 60076 testing (SFRA, PD, OLTC). Now writes the plant's software.; Bühler India, Automation Hardware Engineering Intern, Jun 2025: MCC panels for 8–10 TPH plants: DOL · VFD · soft-starter feeders, I/O cards.; Inovate Technologies, Full Stack Developer Intern, Mar – Jun 2024: Shipped Project Phantom end to end in HTML, CSS and JavaScript.; Mettur Thermal Power Plant, Electrical Intern, Jun – Jul 2024: Inspected generation-side electrical systems and wrote the reports.; Southern Railway, Electrical Intern, Jan 2023: Electrical documentation and quality inspection on the railway side.</title><defs><filter id="brush" x="0" y="0" width="100%" height="100%">
