<pattern id="stripes" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="17" height="34" fill="#FFC400"/><rect x="17" width="17" height="34" fill="#151515"/></pattern></defs><style>.blink{animation:bl 1.4s steps(1) infinite}.blink2{animation:bl 2.3s steps(1) infinite .6s}@keyframes bl{50%{opacity:.15}}.push{animation:push 3s ease-in-out infinite}@keyframes push{0%,80%,100%{transform:none}86%{transform:scale(.94)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="1200" height="400" rx="22" fill="#15181C"/><rect x="20" y="20" width="1160" height="360" rx="18" fill="url(#stripes)" filter="url(#lift)"/><linearGradient id="st1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A4048"/><stop offset="1" stop-color="#23272D"/></linearGradient><rect x="60" y="56" width="1080" height="288" rx="14" fill="url(#st1)" filter="url(#lift)"/><rect x="60" y="56" width="1080" height="288" rx="14" fill="#fff" filter="url(#brush)"/><rect x="61" y="57" width="1078" height="286" rx="14" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.5"/><rect x="60" y="56" width="1080" height="288" rx="14" fill="none" stroke="#0E1013" stroke-width="1.5"/><circle cx="82" cy="78" r="9" fill="url(#screw)" stroke="#0E1013" stroke-width="1"/><line x1="76.6" x2="87.4" y1="78" y2="78" stroke="#4A4F57" stroke-width="2.2" stroke-linecap="round" transform="rotate(20 82 78)"/><circle cx="1118" cy="78" r="9" fill="url(#screw)" stroke="#0E1013" stroke-width="1"/><line x1="1112.6" x2="1123.4" y1="78" y2="78" stroke="#4A4F57" stroke-width="2.2" stroke-linecap="round" transform="rotate(57 1118 78)"/><circle cx="82" cy="322" r="9" fill="url(#screw)" stroke="#0E1013" stroke-width="1"/><line x1="76.6" x2="87.4" y1="322" y2="322" stroke="#4A4F57" stroke-width="2.2" stroke-linecap="round" transform="rotate(94 82 322)"/><circle cx="1118" cy="322" r="9" fill="url(#screw)" stroke="#0E1013" stroke-width="1"/><line x1="1112.6" x2="1123.4" y1="322" y2="322" stroke="#4A4F57" stroke-width="2.2" stroke-linecap="round" transform="rotate(131 1118 322)"/><circle cx="300" cy="200" r="118" fill="#FFC400" filter="url(#lift)"/><circle cx="300" cy="200" r="104" fill="#E9B200"/><text font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#151515" letter-spacing="3"><textPath href="#ring" startOffset="50%" text-anchor="middle">PRESS TO HIRE  ·  PRESS TO HIRE  ·  PRESS TO HIRE</textPath></text><path id="ring" d="M300,200 m-92,0 a92,92 0 1,1 184,0 a92,92 0 1,1 -184,0" fill="none"/><g class="push" style="transform-origin:300px 200px"><circle cx="300" cy="208" r="74" fill="#7A0A12"/><circle cx="300" cy="200" r="74" fill="#D62828"/><circle cx="300" cy="200" r="74" fill="url(#chrome)" opacity=".18"/><ellipse cx="280" cy="172" rx="40" ry="20" fill="#fff" opacity=".35"/></g><text x="470" y="171.2" font-family="Bahnschrift, 'DIN Alternate', 'D-DIN', 'Roboto Condensed', 'Arial Narrow', Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" letter-spacing="2" fill="#000000" opacity=".6">IN CASE OF BORING PROCESS:</text><text x="470" y="170" font-family="Bahnschrift, 'DIN Alternate', 'D-DIN', 'Roboto Condensed', 'Arial Narrow', Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" letter-spacing="2" fill="#E9ECEF" filter="url(#backlit)">IN CASE OF BORING PROCESS:</text><text x="470" y="227.2" font-family="Bahnschrift, 'DIN Alternate', 'D-DIN', 'Roboto Condensed', 'Arial Narrow', Arial, sans-serif" font-size="40" font-weight="800" text-anchor="start" letter-spacing="1" fill="#000000" opacity=".6">BREAK GLASS. CALL KRISHNA.</text><text x="470" y="226" font-family="Bahnschrift, 'DIN Alternate', 'D-DIN', 'Roboto Condensed', 'Arial Narrow', Arial, sans-serif" font-size="40" font-weight="800" text-anchor="start" letter-spacing="1" fill="#E9ECEF" filter="url(#backlit)">BREAK GLASS. CALL KRISHNA.</text><g transform="rotate(-.6 470 254)"><rect x="470" y=