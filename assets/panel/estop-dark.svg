<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="In case of boring process: break glass, call Krishna. krishnarajus2004@gmail.com"><title>In case of boring process: break glass, call Krishna. krishnarajus2004@gmail.com</title><defs><filter id="brush" x="0" y="0" width="100%" height="100%">
