name: Daily edition

# Prints a fresh front page of The Krishna Chronicle every morning: new dateline, issue number,
# headline and weather box. The rest of the paper only changes when scripts/profile_data.py does.
on:
  schedule:
    - cron: "30 23 * * *" # 05:00 India time, an hour clear of the arcade and space-shooter jobs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  print:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Print today's paper
        run: python scripts/gen_press.py
      - name: Deliver it
        run: |
          if git diff --quiet; then
            echo "No change today."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Daily edition: $(TZ=Asia/Kolkata date +%F)"
          git pull --rebase
          git push
