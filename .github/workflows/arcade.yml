name: Arcade (snake, pac-man, breakout)

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["assets/space-shooter.gif"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # pac-man first: snk runs in Docker as root and would leave dist/ unwritable
      - uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman,breakout"

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#F472B6&color_dots=#ebedf0,#ddd6fe,#c4b5fd,#a78bfa,#7c3aed
            dist/snake-dark.svg?palette=github-dark&color_snake=#F472B6&color_dots=#161b22,#3B2F63,#6D4FC2,#A78BFA,#F472B6

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
