name: Koi

# Draws a koi from my GitHub activity with yalongwastaken/git-koi.
# Lives in koi/, which the daily-design rotation never touches, so every design's README can show it.
on:
  schedule:
    - cron: "20 0 * * *" # just after midnight UTC, so the koi shows the day that just ended
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/koi.yml]

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: yalongwastaken/git-koi@v1
        with:
          body: white
          output-dir: koi
      - name: Commit the koi if it changed
        shell: bash
        run: |
          git add koi/koi.gif
          if git diff --cached --quiet; then
            echo "The koi is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "koi: draw the day's koi"
          git pull --rebase --quiet
          git push --quiet
